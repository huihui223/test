<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好运抽奖</title>
<style>
  :root {
    --bg: #1a0b10;
    --bg-soft: #2b1019;
    --bg-panel: #241018;
    --gold: #e9c46a;
    --gold-bright: #ffe3a1;
    --gold-dim: #a5854a;
    --ivory: #f5efe4;
    --ivory-dim: rgba(245, 239, 228, .55);
    --line: rgba(233, 196, 106, .22);
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(1200px 700px at 30% -10%, rgba(233, 196, 106, .07), transparent 60%),
      radial-gradient(900px 600px at 85% 110%, rgba(120, 20, 40, .35), transparent 60%),
      var(--bg);
    color: var(--ivory);
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 22px 32px 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    letter-spacing: .12em;
    color: var(--gold);
  }
  header .sub {
    font-size: 13px;
    color: var(--ivory-dim);
    letter-spacing: .08em;
  }
  header .status {
    margin-left: auto;
    font-size: 13px;
    color: var(--ivory-dim);
  }
  header .status b { color: var(--gold); font-weight: 600; }

  main {
    flex: 1;
    display: flex;
    gap: 0;
    padding: 20px 32px 32px;
    min-height: 0;
  }

  /* ---------- 左侧舞台 ---------- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 32px;
    position: relative;
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(233, 196, 106, .12);
    border-radius: 9px;
    pointer-events: none;
  }
  .prize-title {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: .5em;
    text-indent: .5em;
    color: var(--gold-dim);
  }
  .prize-meta {
    margin-top: 10px;
    font-size: 14px;
    color: var(--ivory-dim);
  }

  .reel {
    margin: 44px 0 40px;
    min-height: 96px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 14px 36px;
    max-width: 100%;
  }
  .reel .name {
    font-family: var(--serif);
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--ivory);
    transition: opacity .12s;
  }
  .reel.rolling .name { color: var(--ivory-dim); }
  .reel.settled .name {
    color: var(--gold-bright);
    text-shadow: 0 0 34px rgba(233, 196, 106, .45);
  }
  .reel.settled .name .suffix {
    font-size: .42em;
    color: var(--gold);
    letter-spacing: .2em;
    margin-left: .3em;
  }
  .reel .placeholder {
    font-size: 17px;
    color: var(--ivory-dim);
    letter-spacing: .15em;
  }

  .controls { display: flex; gap: 18px; align-items: center; }
  .btn-draw {
    font-family: var(--serif);
    font-size: 20px;
    letter-spacing: .35em;
    text-indent: .35em;
    padding: 15px 54px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .btn-draw:hover:not(:disabled) {
    background: rgba(233, 196, 106, .12);
    box-shadow: 0 0 30px rgba(233, 196, 106, .18);
  }
  .btn-draw.stop {
    background: var(--gold);
    color: #241018;
    border-color: var(--gold);
  }
  .btn-draw.stop:hover { box-shadow: 0 0 36px rgba(233, 196, 106, .5); }
  .btn-draw:disabled { opacity: .35; cursor: not-allowed; }
  .btn-draw:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }
  .prize-nav {
    display: flex;
    gap: 10px;
  }
  .btn-nav {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
  }
  .btn-nav:hover:not(:disabled) { background: rgba(233, 196, 106, .1); }
  .btn-nav:disabled { opacity: .3; cursor: not-allowed; }

  /* ---------- 右侧栏 ---------- */
  .panel {
    width: 340px;
    margin-left: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  .card h2 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .25em;
    color: var(--gold);
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    height: 120px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ivory);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.7;
    padding: 10px 12px;
  }
  .row-btns { display: flex; gap: 10px; margin-top: 10px; }
  .btn {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ivory);
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { background: rgba(233, 196, 106, .1); }
  .btn.primary { border-color: var(--gold); color: var(--gold); }

  .prize-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .prize-row input[type="text"] {
    flex: 1;
    min-width: 0;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ivory);
    padding: 7px 10px;
    font-size: 13px;
  }
  .prize-row input[type="number"] {
    width: 62px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ivory);
    padding: 7px 8px;
    font-size: 13px;
  }
  .prize-row .btn-del {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    color: var(--ivory-dim);
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .prize-row .btn-del:hover { color: #e08080; background: rgba(224, 128, 128, .1); }
  .hint { font-size: 12px; color: var(--ivory-dim); margin-top: 4px; line-height: 1.6; }

  .result-list { display: flex; flex-direction: column; gap: 12px; }
  .result-item .r-name {
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: .2em;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .result-item .r-people {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ivory);
  }
  .result-item .r-people span { margin-right: 12px; }
  .empty-tip { font-size: 13px; color: var(--ivory-dim); line-height: 1.7; }

  .btn-reset {
    align-self: flex-start;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid rgba(224, 128, 128, .45);
    background: transparent;
    color: #e08080;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-reset:hover { background: rgba(224, 128, 128, .1); }

  /* ---------- 响应式 ---------- */
  @media (max-width: 860px) {
    main { flex-direction: column; padding: 16px; }
    .panel { width: 100%; margin-left: 0; }
    header { padding: 16px 16px 0; }
    .stage { padding: 28px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reel .name { transition: none; }
    .btn-draw { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>好运抽奖</h1>
  <span class="sub">已中奖者不再参与后续抽奖</span>
  <span class="status">候选 <b id="statPool">0</b> 人 · 待抽 <b id="statRemain">0</b> 人</span>
</header>

<main>
  <section class="stage">
    <div class="prize-title" id="prizeTitle">—</div>
    <div class="prize-meta" id="prizeMeta"></div>
    <div class="reel" id="reel"><span class="placeholder">先在右侧填写名单</span></div>
    <div class="controls">
      <div class="prize-nav">
        <button class="btn-nav" id="prevPrize" title="上一个奖项">‹</button>
        <button class="btn-nav" id="nextPrize" title="下一个奖项">›</button>
      </div>
      <button class="btn-draw" id="drawBtn">开始</button>
    </div>
  </section>

  <aside class="panel">
    <div class="card">
      <h2>参与名单</h2>
      <textarea id="roster" placeholder="每行一位,直接粘贴即可&#10;张三&#10;李四"></textarea>
      <div class="row-btns">
        <button class="btn primary" id="applyRoster">使用这份名单</button>
        <button class="btn" id="fillSample">填入示例</button>
      </div>
    </div>

    <div class="card">
      <h2>奖项设置</h2>
      <div id="prizeRows"></div>
      <div class="row-btns">
        <button class="btn" id="addPrize">+ 添加奖项</button>
      </div>
      <p class="hint">按此顺序抽取,中奖者自动移出候选池。</p>
    </div>

    <div class="card">
      <h2>中奖记录</h2>
      <div class="result-list" id="results">
        <p class="empty-tip">还没有抽出任何奖项。</p>
      </div>
      <div class="row-btns">
        <button class="btn-reset" id="resetBtn">清空记录重新开始</button>
      </div>
    </div>
  </aside>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var rosterEl = $("roster"), reelEl = $("reel"), drawBtn = $("drawBtn"),
      prizeTitleEl = $("prizeTitle"), prizeMetaEl = $("prizeMeta"),
      resultsEl = $("results"), prizeRowsEl = $("prizeRows"),
      statPoolEl = $("statPool"), statRemainEl = $("statRemain"),
      prevBtn = $("prevPrize"), nextBtn = $("nextPrize");

  var state = {
    pool: [],        // 候选池(已移除中奖者)
    prizes: [        // { name, count }
      { name: "三等奖", count: 3 },
      { name: "二等奖", count: 2 },
      { name: "一等奖", count: 1 }
    ],
    winners: [ [], [], [] ],  // 与 prizes 索引对应
    current: 0,      // 当前奖项索引
    rolling: false,
    timer: null
  };

  var SAMPLE = ["赵一鸣", "钱思远", "孙晓棠", "李慕白", "周雨桐", "吴天佑",
                "郑安琪", "王泽宇", "冯可欣", "陈嘉树", "褚月华", "卫东黎"];

  /* ---------- 名单 ---------- */

  function parseRoster(text) {
    var seen = {}, list = [];
    text.split(/\r?\n/).forEach(function (line) {
      var name = line.trim();
      if (name && !seen[name]) { seen[name] = true; list.push(name); }
    });
    return list;
  }

  function applyRoster() {
    if (state.rolling) return;
    var list = parseRoster(rosterEl.value);
    if (!list.length) {
      alert("名单是空的:请至少填写一位参与者。");
      return;
    }
    state.pool = list.slice();
    resetResults(false);
    renderAll();
  }

  /* ---------- 奖项 ---------- */

  function remainingOf(i) {
    var p = state.prizes[i];
    if (!p) return 0;
    return Math.max(0, p.count - state.winners[i].length);
  }

  function readPrizeInputs() {
    var rows = prizeRowsEl.querySelectorAll(".prize-row");
    state.prizes = [];
    rows.forEach(function (row) {
      var name = row.querySelector("input[type=text]").value.trim() || "未命名奖项";
      var count = Math.max(1, parseInt(row.querySelector("input[type=number]").value, 10) || 1);
      state.prizes.push({ name: name, count: count });
    });
    // 中奖记录随奖项行同步增删
    var winners = [];
    rows.forEach(function (row, i) {
      winners.push(state.winners[i] ? state.winners[i].slice() : []);
    });
    state.winners = winners;
    state.current = Math.min(state.current, Math.max(0, state.prizes.length - 1));
  }

  function renderPrizeRows() {
    prizeRowsEl.innerHTML = "";
    state.prizes.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "prize-row";
      row.innerHTML =
        '<input type="text" value="" aria-label="奖项名称">' +
        '<input type="number" min="1" value="" aria-label="中奖人数">' +
        '<button class="btn-del" title="删除该奖项">✕</button>';
      row.querySelector("input[type=text]").value = p.name;
      row.querySelector("input[type=number]").value = p.count;
      row.querySelector("input[type=text]").addEventListener("input", function () {
        this.value && (state.prizes[i].name = this.value.trim() || "未命名奖项");
        renderPrizeMeta(); renderResults();
      });
      row.querySelector("input[type=number]").addEventListener("input", function () {
        var v = Math.max(1, parseInt(this.value, 10) || 1);
        state.prizes[i].count = v;
        renderPrizeMeta(); updateStats();
      });
      row.querySelector(".btn-del").addEventListener("click", function () {
        if (state.rolling) return;
        state.prizes.splice(i, 1);
        state.winners.splice(i, 1);
        if (state.current >= state.prizes.length) state.current = state.prizes.length - 1;
        renderPrizeRows(); renderAll();
      });
      prizeRowsEl.appendChild(row);
    });
  }

  /* ---------- 渲染 ---------- */

  function renderPrizeMeta() {
    var p = state.prizes[state.current];
    if (!p) {
      prizeTitleEl.textContent = "—";
      prizeMetaEl.textContent = "请在右侧添加奖项";
      return;
    }
    prizeTitleEl.textContent = p.name;
    var left = remainingOf(state.current);
    var drawn = state.winners[state.current].length;
    prizeMetaEl.textContent = "共 " + p.count + " 名 · 已抽出 " + drawn + " 名" +
      (left ? " · 本次将抽出 " + left + " 名" : " · 本奖项已抽完");
  }

  function renderReel(names, mode) {
    reelEl.className = "reel " + (mode || "");
    reelEl.innerHTML = "";
    if (!names || !names.length) {
      var tip = document.createElement("span");
      tip.className = "placeholder";
      tip.textContent = mode === "settled"
        ? "本奖项已抽完,切换到下一个奖项吧"
        : (state.pool.length ? "点击「开始」抽出获奖者" : "先在右侧填写名单");
      reelEl.appendChild(tip);
      return;
    }
    names.forEach(function (n, idx) {
      var el = document.createElement("span");
      el.className = "name";
      el.textContent = n;
      if (mode === "settled" && names.length > 1) {
        var suf = document.createElement("span");
        suf.className = "suffix";
        suf.textContent = "第 " + (idx + 1) + " 名";
        el.appendChild(suf);
      }
      reelEl.appendChild(el);
    });
  }

  function renderResults() {
    resultsEl.innerHTML = "";
    var any = false;
    state.prizes.forEach(function (p, i) {
      if (!state.winners[i] || !state.winners[i].length) return;
      any = true;
      var item = document.createElement("div");
      item.className = "result-item";
      var name = document.createElement("div");
      name.className = "r-name";
      name.textContent = p.name;
      var people = document.createElement("div");
      people.className = "r-people";
      state.winners[i].forEach(function (w) {
        var s = document.createElement("span");
        s.textContent = w;
        people.appendChild(s);
      });
      item.appendChild(name);
      item.appendChild(people);
      resultsEl.appendChild(item);
    });
    if (!any) {
      var tip = document.createElement("p");
      tip.className = "empty-tip";
      tip.textContent = "还没有抽出任何奖项。";
      resultsEl.appendChild(tip);
    }
  }

  function updateStats() {
    statPoolEl.textContent = state.pool.length;
    var remain = 0;
    state.prizes.forEach(function (p, i) { remain += remainingOf(i); });
    statRemainEl.textContent = Math.min(remain, state.pool.length);
  }

  function renderNav() {
    prevBtn.disabled = state.current <= 0;
    nextBtn.disabled = state.current >= state.prizes.length - 1;
  }

  function renderAll() {
    renderPrizeMeta();
    renderReel(null, "");
    renderResults();
    updateStats();
    renderNav();
    drawBtn.textContent = "开始";
    drawBtn.classList.remove("stop");
  }

  /* ---------- 抽奖 ---------- */

  function sample(list, n) {
    var arr = list.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr.slice(0, n);
  }

  var DELAYS = [55, 60, 68, 80, 95, 115, 145, 185, 240, 320, 420];

  function startRolling() {
    var p = state.prizes[state.current];
    if (!p) { alert("请先在右侧添加奖项。"); return; }
    var n = remainingOf(state.current);
    if (n <= 0) { alert("「" + p.name + "」已抽完,请切换到下一个奖项。"); return; }
    if (state.pool.length < n) {
      alert("候选只剩 " + state.pool.length + " 人,不够抽出 " + n + " 名。\n可降低奖项人数或清空记录重新开始。");
      return;
    }
    state.rolling = true;
    drawBtn.textContent = "停 止";
    drawBtn.classList.add("stop");
    renderReel(sample(state.pool, Math.min(n, state.pool.length)), "rolling");

    var step = 0;
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) { finalize(); return; }

    (function tick() {
      renderReel(sample(state.pool, Math.min(n, state.pool.length)), "rolling");
      step++;
      if (step < DELAYS.length) {
        state.timer = setTimeout(tick, DELAYS[step]);
      } else {
        finalize();
      }
    })();
  }

  function finalize() {
    clearTimeout(state.timer);
    var p = state.prizes[state.current];
    var n = Math.min(remainingOf(state.current), state.pool.length);
    var picked = sample(state.pool, n);
    picked.forEach(function (w) {
      state.pool.splice(state.pool.indexOf(w), 1);
      state.winners[state.current].push(w);
    });
    state.rolling = false;
    drawBtn.textContent = "开始";
    drawBtn.classList.remove("stop");
    renderReel(picked, "settled");
    renderResults();
    renderPrizeMeta();
    updateStats();
    renderNav();
    // 当前奖项抽完且后面还有未抽完的奖项,自动切过去
    if (remainingOf(state.current) === 0) {
      for (var i = state.current + 1; i < state.prizes.length; i++) {
        if (remainingOf(i) > 0) { state.current = i; break; }
      }
      renderPrizeMeta();
      renderNav();
    }
  }

  function stopRolling() {
    if (!state.rolling) return;
    finalize();
  }

  /* ---------- 重置 ---------- */

  function resetResults(repaint) {
    state.winners = state.prizes.map(function () { return []; });
    state.current = 0;
    // 池 = 名单原文重新解析
    state.pool = parseRoster(rosterEl.value);
    state.rolling = false;
    clearTimeout(state.timer);
    if (repaint !== false) renderAll();
  }

  /* ---------- 事件 ---------- */

  drawBtn.addEventListener("click", function () {
    state.rolling ? stopRolling() : startRolling();
  });
  prevBtn.addEventListener("click", function () {
    if (state.rolling) return;
    if (state.current > 0) { state.current--; renderPrizeMeta(); renderReel(null, ""); renderNav(); }
  });
  nextBtn.addEventListener("click", function () {
    if (state.rolling) return;
    if (state.current < state.prizes.length - 1) { state.current++; renderPrizeMeta(); renderReel(null, ""); renderNav(); }
  });
  $("applyRoster").addEventListener("click", applyRoster);
  $("fillSample").addEventListener("click", function () {
    rosterEl.value = SAMPLE.join("\n");
  });
  $("addPrize").addEventListener("click", function () {
    if (state.rolling) return;
    readPrizeInputs();
    state.prizes.push({ name: "新奖项", count: 1 });
    state.winners.push([]);
    renderPrizeRows(); renderPrizeMeta(); renderNav(); updateStats();
  });
  $("resetBtn").addEventListener("click", function () {
    if (state.rolling) return;
    if (!confirm("确定清空全部中奖记录并恢复完整名单吗?")) return;
    resetResults(true);
  });

  /* ---------- 初始 ---------- */

  rosterEl.value = SAMPLE.join("\n");
  applyRoster();
  renderPrizeRows();
})();
</script>
</body>
</html>
