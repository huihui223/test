<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好运来 · 抽奖</title>
<style>
  :root {
    --red: #a61b1b;
    --red-deep: #7e1214;
    --red-panel: #8f1919;
    --gold: #f6c453;
    --gold-deep: #d9a441;
    --ivory: #fff6e3;
    --ivory-dim: rgba(255, 246, 227, .62);
    --ink: #3d0a0a;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(1000px 520px at 50% -140px, rgba(246, 196, 83, .16), transparent 70%),
      linear-gradient(175deg, var(--red) 0%, var(--red-deep) 100%);
    color: var(--ivory);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶部:品牌 + 奖项标签页 + 设置 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 18px 28px 0;
    flex-wrap: wrap;
  }
  .brand {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: .18em;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 14px rgba(246, 196, 83, .8);
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: .1em;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid rgba(246, 196, 83, .4);
    background: rgba(255, 246, 227, .06);
    color: var(--ivory-dim);
    cursor: pointer;
  }
  .tab small { opacity: .75; margin-left: 6px; }
  .tab:hover { background: rgba(255, 246, 227, .12); }
  .tab.active {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
    font-weight: 600;
  }
  .tab.done { opacity: .45; }
  .tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .btn-gear {
    margin-left: auto;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(246, 196, 83, .4);
    background: transparent;
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
  }
  .btn-gear:hover { background: rgba(255, 246, 227, .1); }

  .statusbar {
    padding: 6px 28px 0;
    font-size: 13px;
    color: var(--ivory-dim);
    letter-spacing: .06em;
  }
  .statusbar b { color: var(--gold); font-weight: 600; }

  /* ---------- 舞台 ---------- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 0;
    padding: 12px 28px;
  }
  .stage .label {
    font-family: var(--serif);
    font-size: 20px;
    letter-spacing: .55em;
    text-indent: .55em;
    color: var(--gold);
  }
  .stage .label-sub {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ivory-dim);
  }

  .reel {
    margin: 30px 0 34px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 18px 44px;
    max-width: 100%;
    min-height: 120px;
  }
  .reel .name {
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(44px, 8vw, 88px);
    letter-spacing: .06em;
    color: var(--ivory);
    line-height: 1.15;
    animation: drop .28s ease-out;
  }
  .reel.rolling .name { color: var(--ivory-dim); }
  .reel.settled .name {
    color: var(--gold);
    text-shadow: 0 4px 26px rgba(61, 10, 10, .55);
  }
  .reel.settled .name:nth-child(2) { animation-delay: .08s; }
  .reel.settled .name:nth-child(3) { animation-delay: .16s; }
  .reel.settled .name:nth-child(4) { animation-delay: .24s; }
  .reel.settled .name:nth-child(5) { animation-delay: .32s; }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .reel .placeholder {
    font-size: 16px;
    color: var(--ivory-dim);
    letter-spacing: .2em;
  }

  .draw-btn {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .4em;
    text-indent: .4em;
    padding: 16px 58px;
    border-radius: 999px;
    cursor: pointer;
    border: 2px solid var(--gold);
    color: var(--gold);
    background: rgba(61, 10, 10, .35);
    box-shadow: inset 0 0 0 4px rgba(166, 27, 27, .6);
    transition: transform .15s, box-shadow .2s, background .2s;
  }
  .draw-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 4px rgba(166, 27, 27, .6), 0 10px 34px rgba(0, 0, 0, .3);
  }
  .draw-btn.stop {
    background: var(--gold);
    color: var(--ink);
    box-shadow: 0 0 0 4px rgba(255, 246, 227, .25);
  }
  .draw-btn:disabled { opacity: .4; cursor: not-allowed; }
  .kbd-hint { margin-top: 14px; font-size: 12px; color: var(--ivory-dim); }

  /* ---------- 底部:中奖横条 ---------- */
  .winbar {
    border-top: 1px solid rgba(246, 196, 83, .35);
    background: rgba(61, 10, 10, .3);
    padding: 14px 28px;
    display: flex;
    gap: 34px;
    align-items: flex-start;
    overflow-x: auto;
    min-height: 74px;
  }
  .winbar .group { flex-shrink: 0; }
  .winbar .g-title {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: .3em;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .winbar .g-people { font-size: 15px; letter-spacing: .04em; }
  .winbar .g-people span { margin-right: 14px; color: var(--ivory); }
  .winbar .empty { font-size: 13px; color: var(--ivory-dim); letter-spacing: .1em; }

  /* ---------- 设置抽屉 ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(30, 4, 4, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 9;
  }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(380px, 100vw);
    background: var(--red-panel);
    border-left: 1px solid rgba(246, 196, 83, .4);
    box-shadow: -18px 0 50px rgba(0, 0, 0, .35);
    transform: translateX(102%);
    transition: transform .3s ease;
    z-index: 10;
    padding: 24px 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: translateX(0); }
  .drawer h2 {
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: .3em;
    color: var(--gold);
  }
  .drawer .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .drawer .close {
    border: none;
    background: transparent;
    color: var(--ivory-dim);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 8px;
  }
  .drawer .close:hover { color: var(--ivory); }

  textarea, .drawer input[type=text], .drawer input[type=number] {
    background: rgba(61, 10, 10, .45);
    border: 1px solid rgba(246, 196, 83, .35);
    border-radius: 8px;
    color: var(--ivory);
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 10px;
  }
  textarea { width: 100%; height: 130px; resize: vertical; line-height: 1.7; }

  .row-btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .btn {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid rgba(246, 196, 83, .45);
    background: transparent;
    color: var(--ivory);
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { background: rgba(255, 246, 227, .12); }
  .btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
  .btn.primary:hover { background: var(--gold-deep); }

  .prize-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .prize-row input[type=text] { flex: 1; min-width: 0; }
  .prize-row input[type=number] { width: 60px; }
  .prize-row .btn-del {
    width: 28px; height: 28px;
    border: none; background: transparent;
    color: var(--ivory-dim); font-size: 15px; cursor: pointer;
    border-radius: 6px; flex-shrink: 0;
  }
  .prize-row .btn-del:hover { color: var(--gold); background: rgba(255, 246, 227, .1); }
  .hint { font-size: 12px; color: var(--ivory-dim); margin-top: 6px; line-height: 1.6; }
  .btn-reset {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid rgba(255, 246, 227, .4);
    background: transparent;
    color: var(--ivory);
    font-size: 13px;
    cursor: pointer;
  }
  .btn-reset:hover { background: rgba(255, 246, 227, .12); }

  @media (max-width: 700px) {
    header { padding: 14px 16px 0; gap: 12px; }
    .statusbar { padding: 6px 16px 0; }
    .stage { padding: 10px 14px; }
    .winbar { padding: 12px 16px; gap: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reel .name { animation: none; }
    .drawer, .scrim { transition: none; }
    .draw-btn { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">好运来</div>
  <nav class="tabs" id="tabs" aria-label="奖项切换"></nav>
  <button class="btn-gear" id="gearBtn" title="名单与奖项设置" aria-label="打开设置">⚙</button>
</header>
<div class="statusbar">候选 <b id="statPool">0</b> 人 · 还将抽出 <b id="statRemain">0</b> 人 · 中奖者不再参与后续抽奖</div>

<main class="stage">
  <div class="label" id="prizeTitle">—</div>
  <div class="label-sub" id="prizeMeta"></div>
  <div class="reel" id="reel" aria-live="polite"><span class="placeholder">打开右上角 ⚙ 填写名单</span></div>
  <button class="draw-btn" id="drawBtn">开始抽奖</button>
  <div class="kbd-hint">提示:按空格键也可开始 / 停止</div>
</main>

<footer class="winbar" id="winbar">
  <span class="empty">中奖名单将显示在这里</span>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" aria-label="设置">
  <div class="card-head">
    <h2>参与名单</h2>
    <button class="close" id="closeDrawer" aria-label="关闭设置">✕</button>
  </div>
  <div>
    <textarea id="roster" placeholder="每行一位,直接粘贴即可&#10;张三&#10;李四"></textarea>
    <div class="row-btns">
      <button class="btn primary" id="applyRoster">使用这份名单</button>
      <button class="btn" id="fillSample">填入示例</button>
    </div>
  </div>

  <div>
    <h2>奖项设置</h2>
    <div id="prizeRows" style="margin-top:10px;"></div>
    <div class="row-btns">
      <button class="btn" id="addPrize">+ 添加奖项</button>
    </div>
    <p class="hint">按此顺序抽取,中奖者自动移出候选池。</p>
  </div>

  <div>
    <h2>重置</h2>
    <div class="row-btns">
      <button class="btn-reset" id="resetBtn">清空记录重新开始</button>
    </div>
  </div>
</aside>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var rosterEl = $("roster"), reelEl = $("reel"), drawBtn = $("drawBtn"),
      tabsEl = $("tabs"), prizeTitleEl = $("prizeTitle"), prizeMetaEl = $("prizeMeta"),
      winbarEl = $("winbar"), prizeRowsEl = $("prizeRows"),
      statPoolEl = $("statPool"), statRemainEl = $("statRemain");

  var state = {
    pool: [],
    prizes: [
      { name: "三等奖", count: 3 },
      { name: "二等奖", count: 2 },
      { name: "一等奖", count: 1 }
    ],
    winners: [ [], [], [] ],
    current: 0,
    rolling: false,
    timer: null
  };

  var SAMPLE = ["赵一鸣", "钱思远", "孙晓棠", "李慕白", "周雨桐", "吴天佑",
                "郑安琪", "王泽宇", "冯可欣", "陈嘉树", "褚月华", "卫东黎"];

  /* ---------- 抽屉 ---------- */

  function openDrawer() { document.body.classList.add("drawer-open"); }
  function closeDrawerFn() { document.body.classList.remove("drawer-open"); }
  $("gearBtn").addEventListener("click", openDrawer);
  $("closeDrawer").addEventListener("click", closeDrawerFn);
  $("scrim").addEventListener("click", closeDrawerFn);

  /* ---------- 名单 ---------- */

  function parseRoster(text) {
    var seen = {}, list = [];
    text.split(/\r?\n/).forEach(function (line) {
      var name = line.trim();
      if (name && !seen[name]) { seen[name] = true; list.push(name); }
    });
    return list;
  }

  function applyRoster() {
    if (state.rolling) return;
    var list = parseRoster(rosterEl.value);
    if (!list.length) {
      alert("名单是空的:请至少填写一位参与者。");
      return;
    }
    state.pool = list.slice();
    resetResults(false);
    renderAll();
    closeDrawerFn();
  }

  /* ---------- 奖项 ---------- */

  function remainingOf(i) {
    var p = state.prizes[i];
    if (!p) return 0;
    return Math.max(0, p.count - state.winners[i].length);
  }

  function renderPrizeRows() {
    prizeRowsEl.innerHTML = "";
    state.prizes.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "prize-row";
      row.innerHTML =
        '<input type="text" value="" aria-label="奖项名称">' +
        '<input type="number" min="1" value="" aria-label="中奖人数">' +
        '<button class="btn-del" title="删除该奖项">✕</button>';
      row.querySelector("input[type=text]").value = p.name;
      row.querySelector("input[type=number]").value = p.count;
      row.querySelector("input[type=text]").addEventListener("input", function () {
        state.prizes[i].name = this.value.trim() || "未命名奖项";
        renderTabs(); renderStage();
      });
      row.querySelector("input[type=number]").addEventListener("input", function () {
        state.prizes[i].count = Math.max(1, parseInt(this.value, 10) || 1);
        renderTabs(); renderStage(); updateStats();
      });
      row.querySelector(".btn-del").addEventListener("click", function () {
        if (state.rolling) return;
        state.prizes.splice(i, 1);
        state.winners.splice(i, 1);
        if (state.current >= state.prizes.length) state.current = state.prizes.length - 1;
        renderPrizeRows(); renderAll();
      });
      prizeRowsEl.appendChild(row);
    });
  }

  /* ---------- 渲染 ---------- */

  function renderTabs() {
    tabsEl.innerHTML = "";
    state.prizes.forEach(function (p, i) {
      var t = document.createElement("button");
      t.className = "tab" + (i === state.current ? " active" : "") +
        (remainingOf(i) === 0 ? " done" : "");
      t.appendChild(document.createTextNode(p.name));
      var small = document.createElement("small");
      small.textContent = remainingOf(i) === 0 ? "已抽完" : "剩 " + remainingOf(i) + "/" + p.count;
      t.appendChild(small);
      t.addEventListener("click", function () {
        if (state.rolling) return;
        state.current = i;
        renderTabs(); renderStage(); renderReel(null, "");
      });
      tabsEl.appendChild(t);
    });
  }

  function renderStage() {
    var p = state.prizes[state.current];
    if (!p) {
      prizeTitleEl.textContent = "—";
      prizeMetaEl.textContent = "请打开 ⚙ 添加奖项";
      return;
    }
    prizeTitleEl.textContent = p.name;
    var left = remainingOf(state.current);
    var drawn = state.winners[state.current].length;
    prizeMetaEl.textContent = "共 " + p.count + " 名 · 已抽出 " + drawn + " 名" +
      (left ? " · 本次将抽出 " + left + " 名" : " · 本奖项已抽完");
  }

  function renderReel(names, mode) {
    reelEl.className = "reel " + (mode || "");
    reelEl.innerHTML = "";
    if (!names || !names.length) {
      var tip = document.createElement("span");
      tip.className = "placeholder";
      tip.textContent = mode === "settled"
        ? "本奖项已抽完,点上方标签切换奖项"
        : (state.pool.length ? "点击「开始抽奖」或按空格键" : "打开右上角 ⚙ 填写名单");
      reelEl.appendChild(tip);
      return;
    }
    names.forEach(function (n) {
      var el = document.createElement("span");
      el.className = "name";
      el.textContent = n;
      reelEl.appendChild(el);
    });
  }

  function renderWinbar() {
    winbarEl.innerHTML = "";
    var any = false;
    state.prizes.forEach(function (p, i) {
      if (!state.winners[i] || !state.winners[i].length) return;
      any = true;
      var g = document.createElement("div");
      g.className = "group";
      var t = document.createElement("div");
      t.className = "g-title";
      t.textContent = p.name;
      var ppl = document.createElement("div");
      ppl.className = "g-people";
      state.winners[i].forEach(function (w) {
        var s = document.createElement("span");
        s.textContent = w;
        ppl.appendChild(s);
      });
      g.appendChild(t);
      g.appendChild(ppl);
      winbarEl.appendChild(g);
    });
    if (!any) {
      var e = document.createElement("span");
      e.className = "empty";
      e.textContent = "中奖名单将显示在这里";
      winbarEl.appendChild(e);
    }
  }

  function updateStats() {
    statPoolEl.textContent = state.pool.length;
    var remain = 0;
    state.prizes.forEach(function (p, i) { remain += remainingOf(i); });
    statRemainEl.textContent = Math.min(remain, state.pool.length);
  }

  function renderAll() {
    renderTabs();
    renderStage();
    renderReel(null, "");
    renderWinbar();
    updateStats();
    drawBtn.textContent = "开始抽奖";
    drawBtn.classList.remove("stop");
  }

  /* ---------- 抽奖 ---------- */

  function sample(list, n) {
    var arr = list.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr.slice(0, n);
  }

  var DELAYS = [55, 60, 68, 80, 95, 115, 145, 185, 240, 320, 420];

  function startRolling() {
    var p = state.prizes[state.current];
    if (!p) { alert("请先打开 ⚙ 添加奖项。"); return; }
    var n = remainingOf(state.current);
    if (n <= 0) { alert("「" + p.name + "」已抽完,请切换到下一个奖项。"); return; }
    if (state.pool.length < n) {
      alert("候选只剩 " + state.pool.length + " 人,不够抽出 " + n + " 名。\n可降低奖项人数或清空记录重新开始。");
      return;
    }
    state.rolling = true;
    drawBtn.textContent = "停 止";
    drawBtn.classList.add("stop");
    closeDrawerFn();

    var pick = function () { return sample(state.pool, Math.min(n, state.pool.length)); };
    renderReel(pick(), "rolling");

    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) { finalize(); return; }

    var step = 0;
    (function tick() {
      renderReel(pick(), "rolling");
      step++;
      if (step < DELAYS.length) {
        state.timer = setTimeout(tick, DELAYS[step]);
      } else {
        finalize();
      }
    })();
  }

  function finalize() {
    clearTimeout(state.timer);
    var p = state.prizes[state.current];
    var n = Math.min(remainingOf(state.current), state.pool.length);
    var picked = sample(state.pool, n);
    picked.forEach(function (w) {
      state.pool.splice(state.pool.indexOf(w), 1);
      state.winners[state.current].push(w);
    });
    state.rolling = false;
    drawBtn.textContent = "开始抽奖";
    drawBtn.classList.remove("stop");
    renderReel(picked, "settled");
    renderWinbar();
    renderStage();
    updateStats();
    renderTabs();
    if (remainingOf(state.current) === 0) {
      for (var i = state.current + 1; i < state.prizes.length; i++) {
        if (remainingOf(i) > 0) { state.current = i; break; }
      }
      renderStage();
      renderTabs();
    }
  }

  function stopRolling() {
    if (!state.rolling) return;
    finalize();
  }

  /* ---------- 重置 ---------- */

  function resetResults(repaint) {
    state.winners = state.prizes.map(function () { return []; });
    state.current = 0;
    state.pool = parseRoster(rosterEl.value);
    state.rolling = false;
    clearTimeout(state.timer);
    if (repaint !== false) renderAll();
  }

  /* ---------- 事件 ---------- */

  drawBtn.addEventListener("click", function () {
    state.rolling ? stopRolling() : startRolling();
  });
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space") return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "button") return;
    e.preventDefault();
    state.rolling ? stopRolling() : startRolling();
  });
  $("applyRoster").addEventListener("click", applyRoster);
  $("fillSample").addEventListener("click", function () {
    rosterEl.value = SAMPLE.join("\n");
  });
  $("addPrize").addEventListener("click", function () {
    if (state.rolling) return;
    state.prizes.push({ name: "新奖项", count: 1 });
    state.winners.push([]);
    renderPrizeRows(); renderTabs(); renderStage(); updateStats();
  });
  $("resetBtn").addEventListener("click", function () {
    if (state.rolling) return;
    if (!confirm("确定清空全部中奖记录并恢复完整名单吗?")) return;
    resetResults(true);
  });

  /* ---------- 初始 ---------- */

  rosterEl.value = SAMPLE.join("\n");
  applyRoster();
  renderPrizeRows();
})();
</script>
</body>
</html>
