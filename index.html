<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="张三的个人主页：简介与联系方式。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a8dff'/%3E%3Cstop offset='1' stop-color='%238f6aff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='28' font-weight='600' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
  <title>张三 · 个人主页</title>
  <style>
    :root {
      --bg-start: #f6f7f9;
      --bg-end: #eef0f4;
      --card-bg: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --btn-bg: #f2f3f5;
      --btn-hover: #e6e8ec;
      --focus: #6a8dff;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-start: #1c1c1e;
        --bg-end: #141416;
        --card-bg: #2c2c2e;
        --text: #f5f5f7;
        --text-secondary: #a1a1a6;
        --btn-bg: #3a3a3c;
        --btn-hover: #48484a;
        --focus: #8fb0ff;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 48px 32px;
      text-align: center;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow);
      animation: rise 0.6s ease both;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #6a8dff 0%, #8f6aff 100%);
      color: #fff;
      font-size: 36px;
      font-weight: 600;
      user-select: none;
      transition: transform 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.04);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .links a {
      padding: 10px 22px;
      font-size: 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--btn-bg);
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .links a:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .links a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }
      .avatar,
      .links a {
        transition: none;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">Z</div>
    <h1>张三</h1>
    <p class="bio">一个喜欢写代码、做小玩意的人。</p>
    <nav class="links">
      <a href="resume.html">个人简历</a>
      <a href="https://github.com/yourname" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">邮箱</a>
    </nav>
  </main>
</body>
</html>
